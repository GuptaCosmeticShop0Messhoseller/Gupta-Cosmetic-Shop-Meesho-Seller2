<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Dashboard</title>

<link rel="stylesheet" href="style.css">

<script type="module" src="firebase.js"></script>
</head>

<body>

<h1>🏪 Seller Dashboard</h1>

<h2 id="welcome">Welcome Seller</h2>

<div class="menu">

<button id="btnAdd">➕ Add Product</button>

<button id="btnProducts">📦 My Products</button>

<button id="btnOrders">🛒 My Orders</button>

<button id="btnLogout">🚪 Logout</button>

</div>

<hr>

<div id="addProductBox">

<h2>Add Product</h2>

<input
type="text"
id="productName"
placeholder="Product Name">

<input
type="number"
id="productPrice"
placeholder="Price">

<input
type="text"
id="productCategory"
placeholder="Category">

<input
type="text"
id="productImage"
placeholder="Image URL">

<button id="saveProductBtn">
Save Product
</button>

</div>

<hr>

<h2>My Products</h2>

<div id="sellerProducts"></div>

<script src="seller-dashboard.js?v=5"></script>
</body>
</html>
